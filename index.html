<script>
const ICON=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb2ff"/><stop offset="1" stop-color="#2b4c9b"/></linearGradient></defs><rect width="128" height="128" rx="28" fill="url(#g)"/><g stroke="#5a3515" stroke-width="3" stroke-linejoin="round"><rect x="22" y="94" width="26" height="18" rx="3" fill="#e0a85e"/><rect x="51" y="94" width="26" height="18" rx="3" fill="#d49a50"/><rect x="80" y="94" width="26" height="18" rx="3" fill="#e0a85e"/><rect x="22" y="74" width="84" height="18" rx="3" fill="#d49a50"/><rect x="22" y="54" width="26" height="18" rx="3" fill="#e0a85e"/><rect x="51" y="54" width="26" height="18" rx="3" fill="#d49a50"/><rect x="80" y="54" width="26" height="18" rx="3" fill="#e0a85e"/><path d="M38 52V28l14 10 12-18 12 18 14-10v24z" fill="#ffd24a" stroke="#8a5a00"/></g><circle cx="64" cy="42" r="4" fill="#e23"/></svg>`;
$=id=>document.getElementById(id);

{const l=document.createElement('link');l.rel='icon';l.href='data:image/svg+xml,'+encodeURIComponent(ICON);document.head.appendChild(l)}

const me={id:Math.random().toString(36).slice(2,8),hp:100,k:0,d:0,blocks:50,w:1,rot:0,mount:null,king:null,kingY:0};
let room=null,peers={},playing=false,over=false,yaw=0,pit=-.25,cd=0,nid=0,grounded=0,gp=new V3(),gOK=false,locked=false,dragMode=false,effects=[],ghost=null,gType=0,lastHit=0;
// ---------- audio
let AC;
function noise(d){const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;return s}
function tone(f0,f1,d,ty,v,dl=0){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
function nz(d,f,v,dl=0){const s=noise(d),fl=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime+dl;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(AC.destination);s.start(t)}
function sfx(n,at){if(!AC)return;const v=at?Math.max(.05,1-at.distanceTo(cam.position)/45):1;
 ({place:()=>{tone(180,60,.12,'sine',.5*v);nz(.05,1500,.25*v)},knock:()=>{tone(150,70,.07,'sine',.25*v);nz(.04,2000,.12*v)},pick:()=>tone(300,520,.08,'triangle',.3*v),
 gun:()=>{tone(900,120,.15,'sawtooth',.22*v);nz(.12,3000,.3*v)},cannon:()=>{tone(120,30,.5,'sine',.8*v);nz(.4,500,.5*v)},
 boom:()=>{nz(.7,400,.9*v);tone(80,25,.6,'sine',.7*v)},hit:()=>tone(900,400,.1,'square',.18),hurt:()=>tone(200,70,.25,'sawtooth',.4),
 mount:()=>{tone(220,440,.1,'square',.15);tone(330,660,.1,'square',.15,.08)},fall:()=>tone(500,50,1,'sawtooth',.4),
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.28,'triangle',.35,i*.15)),lose:()=>[400,330,260,180].forEach((f,i)=>tone(f,f,.3,'sawtooth',.3,i*.2))}[n]||(()=>0))()}
// ---------- three
const scene=new THREE.Scene();{const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#4f93e6');g.addColorStop(1,'#dcedff');x.fillStyle=g;x.fillRect(0,0,2,256);scene.background=new THREE.CanvasTexture(c)}scene.fog=new THREE.Fog(0xbfe0ff,45,140);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);
const rd=new THREE.WebGLRenderer({antialias:true});rd.shadowMap.type=THREE.PCFSoftShadowMap;rd.toneMapping=THREE.ACESFilmicToneMapping;rd.toneMappingExposure=1.1;rd.outputEncoding=THREE.sRGBEncoding;rd.setSize(innerWidth,innerHeight);rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.shadowMap.enabled=true;document.body.appendChild(rd.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x9a7a50,.85));
const sun=new THREE.DirectionalLight(0xfff2d8,.8);sun.position.set(14,28,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:90});scene.add(sun);
function woodTex(base='#c89458'){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,128,128);
 for(let i=0;i<45;i++){x.fillStyle=`rgba(90,55,20,${Math.random()*.25})`;x.fillRect(0,Math.random()*128,128,1+Math.random()*2)}
 x.strokeStyle='rgba(60,35,10,.65)';x.lineWidth=5;x.strokeRect(0,0,128,128);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;return t}
const WT=woodTex(),GT=woodTex('#eeeeee'),rc=new THREE.Raycaster(),solids=[];
const ft=WT.clone();ft.needsUpdate=true;ft.repeat.set(60,60);
const gm=new THREE.Mesh(new THREE.PlaneGeometry(300,300).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:ft,color:0xe8c9a0}));gm.receiveShadow=true;scene.add(gm);solids.push(gm);
// ---------- physics
const W=new CANNON.World();W.gravity.set(0,-20,0);W.solver.iterations=14;W.allowSleep=true;W.broadphase=new CANNON.SAPBroadphase(W);
const mat=new CANNON.Material(),pm=new CANNON.Material();
W.addContactMaterial(new CANNON.ContactMaterial(mat,mat,{friction:.6,restitution:.02}));
W.addContactMaterial(new CANNON.ContactMaterial(pm,mat,{friction:0,restitution:0}));
const gb=new CANNON.Body({mass:0,material:mat,shape:new CANNON.Plane()});gb.quaternion.setFromAxisAngle(new CV(1,0,0),-Math.PI/2);W.addBody(gb);
const pb=new CANNON.Body({mass:5,shape:new CANNON.Sphere(.45),material:pm,fixedRotation:true,linearDamping:.05,allowSleep:false});W.addBody(pb);
// ---------- jenga map (static)
function stat(x,y,z,w,h,d,ry=0){const t=WT.clone();t.needsUpdate=true;t.repeat.set(Math.max(1,Math.max(w,d)/1.2),Math.max(1,h/.4));
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({map:t}));m.position.set(x,y,z);m.rotation.y=ry;m.castShadow=m.receiveShadow=true;scene.add(m);solids.push(m);
 const b=new CANNON.Body({mass:0,material:mat,shape:new CANNON.Box(new CV(w/2,h/2,d/2)),position:new CV(x,y,z)});b.quaternion.setFromAxisAngle(new CV(0,1,0),ry);W.addBody(b)}
function map(){stat(0,3,-22,45,6,1.5);stat(0,3,22,45,6,1.5);stat(-22,3,0,1.5,6,45);stat(22,3,0,1.5,6,45);
 for(const sx of[-1,1])for(const sz of[-1,1])stat(sx*19,5,sz*19,3.2,10,3.2,.3);
 stat(-8,.9,-6,3.6,1.8,1.2,.3);stat(9,.9,7,1.2,1.8,3.6,-.2);stat(8,.6,-8,2.4,1.2,2.4);stat(-12,.6,-14,2.4,1.2,2.4,.5);stat(13,.6,14,2.4,1.2,2.4,.2);
 stat(-9,1.7,10,5,.5,3);stat(-11,.85,10,.5,1.7,2.6);stat(-7,.85,10,.5,1.7,2.6);stat(-5.4,.5,10,1.2,1,2.4);
 stat(9,1.7,-10,5,.5,3);stat(11,.85,-10,.5,1.7,2.6);stat(7,.85,-10,.5,1.7,2.6);stat(5.4,.5,-10,1.2,1,2.4)}
const SK=[['클래식',0xd9a066,0],['초콜릿',0x6b3a22,0],['네온',0x3aa0ff,0x0a3a7a],['체리',0xff8fb0,0x30101a],['민트',0x7fe0b8,0x0a3a2a],['아이스',0xcfeaff,0x203a4a]];let skin=0;
function skinMat(k){if(!k)return new THREE.MeshLambertMaterial({map:WT,color:new THREE.Color().setHSL(.09,.5,.55+Math.random()*.2)});const s=SK[k];return new THREE.MeshLambertMaterial({map:GT,color:new THREE.Color(s[1]).offsetHSL(0,0,(Math.random()-.5)*.08),emissive:s[2]})}
// ---------- blocks / turrets
const blocks={},bgeo=new THREE.BoxGeometry(L,H,H),bshape=new CANNON.Box(new CV(L/2,H/2,H/2)),q90=new CANNON.Quaternion();q90.setFromAxisAngle(new CV(0,1,0),Math.PI/2);
function build(ty,mt,sk=0){const g=new THREE.Group(),ms=[],add=(y,r)=>{const m=new THREE.Mesh(bgeo,mt||skinMat(sk));m.position.y=y;m.rotation.y=r?Math.PI/2:0;m.castShadow=m.receiveShadow=true;g.add(m);ms.push(m)};
 if(ty==1)add(0,0);if(ty==2){add(-H/2,0);add(H/2,1)}if(ty==3){add(-H,0);add(0,1);add(H,0)}
 if(ty>1){const z=new THREE.Group(),r=ty==2?.09:.16,len=ty==2?.5:.75,c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10),new THREE.MeshLambertMaterial({color:0x222222}));
  z.position.y=HY[ty];c.position.y=len/2;c.castShadow=true;z.add(c);g.add(z);g.mz=z}
 return{g,ms}}
let lastK=0;
function addBlock(id,x,y,z,r,sleep,ty=1,sk=0){if(blocks[id])return;const{g,ms}=build(ty,null,sk);scene.add(g);
 const b=new CANNON.Body({mass:ty==3?1.5:ty==2?.9:.5,material:mat,allowSleep:true,sleepSpeedLimit:.2,sleepTimeLimit:.4,position:new CV(x,y,z)});
 if(ty==1)b.addShape(bshape);else if(ty==2){b.addShape(bshape,new CV(0,-H/2,0));b.addShape(bshape,new CV(0,H/2,0),q90)}else{b.addShape(bshape,new CV(0,-H,0));b.addShape(bshape,new CV(0,0,0),q90);b.addShape(bshape,new CV(0,H,0))}
 b.quaternion.setFromAxisAngle(new CV(0,1,0),r?Math.PI/2:0);W.addBody(b);
 b.addEventListener('collide',e=>{const n=performance.now();if(n-lastK>70&&e.contact.getImpactVelocityAlongNormal()>2.5){lastK=n;sfx('knock',new V3(b.position.x,b.position.y,b.position.z))}});
 ms.forEach(m=>{m.userData.id=id;solids.push(m)});blocks[id]={g,ms,b,ty,mz:g.mz,aq:new THREE.Quaternion()};if(sleep)b.sleep()}
function rmBlock(id){const o=blocks[id];if(!o)return;scene.remove(o.g);W.removeBody(o.b);o.ms.forEach(m=>solids.splice(solids.indexOf(m),1));delete blocks[id]}
function tower(){for(let i=0;i<12;i++){const r=i%2;for(let j=-1;j<=1;j++)addBlock('t'+i+'_'+j,r?j*H:0,H/2+i*H+.01,r?0:j*H,r,1)}}
function setGhost(s){if(ghost)scene.remove(ghost);ghost=build(s==4?1:s,new THREE.MeshBasicMaterial({color:s==4?0xffd24a:0x44ff88,transparent:true,opacity:.45})).g;scene.add(ghost);gType=s}
const dirOf=(y,p)=>new V3(-Math.sin(y)*Math.cos(p),Math.sin(p),-Math.cos(y)*Math.cos(p));
// ---------- players
function mkPlayer(c){const g=new THREE.Group(),t=new THREE.Mesh(new THREE.BoxGeometry(.6,.8,.4),new THREE.MeshLambertMaterial({color:c}));t.position.y=.05;
 const h=new THREE.Mesh(new THREE.SphereGeometry(.24,12,8),new THREE.MeshLambertMaterial({color:0xffd8b0}));h.position.y=.68;
 g.bar=new THREE.Mesh(new THREE.BoxGeometry(1,.08,.08),new THREE.MeshBasicMaterial({color:0x33dd44}));g.bar.position.y=1.1;
 t.castShadow=h.castShadow=true;g.legs=[-.15,.15].map(x=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.22,.3,.25),new THREE.MeshLambertMaterial({color:0x333344}));l.position.set(x,-.35,0);l.castShadow=true;g.add(l);return l});g.add(t,h,g.bar);scene.add(g);return g}
const pmesh=mkPlayer(0x3a7bd5);
function syncPeers(list){const seen={};
 for(const p of list){if(p.isMe)continue;const s=p.presence;if(!s||!s.id)continue;seen[s.id]=1;let o=peers[s.id];
  if(!o){const kb=new CANNON.Body({mass:0,type:CANNON.Body.KINEMATIC,shape:new CANNON.Sphere(.45),material:pm});W.addBody(kb);o=peers[s.id]={id:s.id,g:mkPlayer(0xe04848),pos:new V3(s.x,s.y,s.z),kb}}o.t=s}
 for(const id in peers)if(id!='bot'&&!seen[id]){scene.remove(peers[id].g);W.removeBody(peers[id].kb);delete peers[id]}}
function addBot(){peers.bot={id:'bot',g:mkPlayer(0xe0a020),pos:new V3(0,.45,-9),t:{x:0,y:.45,z:-9,yaw:0,hp:100}}}
// ---------- combat
function fx(p,col,s,t,grow){const m=new THREE.Mesh(new THREE.SphereGeometry(s,10,8),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.7}));m.position.copy(p);scene.add(m);effects.push({m,t,grow})}
function tracer(a,b){const l=a.distanceTo(b),m=new THREE.Mesh(new THREE.BoxGeometry(.06,.06,l),new THREE.MeshBasicMaterial({color:0xffee66}));m.position.copy(a).lerp(b,.5);m.lookAt(b);scene.add(m);effects.push({m,t:.08})}
function boom(pt,local){const R=3.5,P=new CV(pt.x,pt.y,pt.z);
 for(const id in blocks){const b=blocks[id].b,d=b.position.vsub(P),l=d.norm();if(l<R){d.normalize();d.y+=.4;b.wakeUp();b.applyImpulse(d.scale(9*(1-l/R)),new CV())}}
 const pp=new V3(pb.position.x,pb.position.y,pb.position.z),l=pp.distanceTo(pt);if(l<R&&!me.mount){const k=pp.sub(pt).normalize().multiplyScalar(12*(1-l/R));pb.velocity.x+=k.x;pb.velocity.y+=k.y+4;pb.velocity.z+=k.z}
 if(local)for(const id in peers){const o=peers[id],q=o.pos.distanceTo(pt);if(q<R)hit(o,Math.round(40*(1-q/R))+5)}
 for(let i=0;i<14;i++){const m=new THREE.Mesh(bgeo,new THREE.MeshLambertMaterial({map:WT}));m.scale.setScalar(.2);m.position.copy(pt);scene.add(m);effects.push({m,t:.9,v:new V3(Math.random()-.5,Math.random()*.9+.2,Math.random()-.5).multiplyScalar(11)})}fx(pt,0xff9933,1,.35,10);fx(pt,0xffee88,.6,.2,6);sfx('boom',pt)}
const aimHits=()=>rc.intersectObjects(solids).filter(h=>!(me.mount&&h.object.userData.id==me.mount));
function shoot(o,d,t,local,mul=1){rc.set(o,d);rc.far=70;const h=aimHits()[0];let best=h?h.distance:rc.far,tg=null;
 if(local&&t!='c')for(const id in peers){const p=peers[id];if(!p.t||p.t.hp<=0)continue;
  const v=rc.ray.intersectSphere(new THREE.Sphere(p.pos.clone().add(new V3(0,.2,0)),.75),new V3());if(v){const l=o.distanceTo(v);if(l<best){best=l;tg=p}}}
 const e=o.clone().addScaledVector(d,best);fx(o,0xffcc44,.18,.06);
 if(t=='g')tracer(o,e);sfx(t=='c'?'cannon':'gun',o);
 if(t=='c')boom(e,local);
 else if(tg)hit(tg,Math.round(12*mul));
 else if(h&&h.object.userData.id){const b=blocks[h.object.userData.id].b;b.wakeUp();b.applyImpulse(new CV(d.x*2,d.y*2,d.z*2),new CV())}}
function hit(o,d){sfx('hit');if(o.id=='bot'){o.t.hp-=d;if(o.t.hp<=0){me.k++;setTimeout(()=>o.t.hp=100,1500)}}else room&&room.emit('ev',{k:'h',to:o.id,d,by:me.id})}
function hurt(n,by){if(me.hp<=0||over)return;me.hp-=n;sfx('hurt');$('dm').style.opacity=1;setTimeout(()=>$('dm').style.opacity=0,120);
 if(me.hp<=0){me.hp=0;me.d++;me.mount=null;room&&room.emit('ev',{k:'k',by});msg('💀 쓰러졌다! 곧 부활합니다');setTimeout(respawn,2500)}}
function respawn(){me.hp=100;const z=room?(Math.random()<.5?14:-14):6;pb.position.set(Math.random()*6-3,1,z);pb.velocity.set(0,0,0);yaw=z>0?0:Math.PI;msg('')}
function endGame(win){if(over)return;over=true;me.mount=null;document.exitPointerLock&&document.exitPointerLock();sfx(win?'win':'lose');
 $('et').innerHTML=win?'🏆 승리!<div style="font-size:20px;font-weight:600">상대의 왕이 무너졌어요</div>':'👑💥 패배...<div style="font-size:20px;font-weight:600">내 왕이 쓰러졌어요</div>';$('end').style.display='flex'}
function ev(m){if(m.isMe||!m.data)return;const d=m.data;
 if(d.k=='b'){addBlock(d.id,d.p[0],d.p[1],d.p[2],d.r,0,d.ty||1,d.sk||0);sfx('place',new V3(...d.p))}else if(d.k=='x'){rmBlock(d.id);sfx('pick')}
 else if(d.k=='s')shoot(new V3(...d.o),new V3(...d.d),d.t,false);
 else if(d.k=='h'&&d.to==me.id)hurt(d.d,d.by);else if(d.k=='k'&&d.by==me.id)me.k++;
 else if(d.k=='l')endGame(true)}
// ---------- actions
function aim(){rc.setFromCamera({x:0,y:0},cam);rc.far=80;const h=aimHits()[0];return{h,A:h?h.point.clone():rc.ray.at(60,new V3())}}
function muzzle(o){const d=dirOf(yaw,pit);return o.g.localToWorld(new V3(0,HY[o.ty],0)).addScaledVector(d,o.ty==2?.5:.75)}
function act(){if(!playing||me.hp<=0||over)return;const now=performance.now();if(now<cd)return;
 if(me.mount){const o=blocks[me.mount];if(!o)return;const t=o.ty==2?'g':'c';cd=now+(o.ty==2?300:1400);
  const mz=muzzle(o),d=aim().A.sub(mz).normalize();shoot(mz,d,t,true);room&&room.emit('ev',{k:'s',t,o:[mz.x,mz.y,mz.z],d:[d.x,d.y,d.z]});return}
 const s=me.w,ty=s==4?1:s;if(me.blocks<C[s]||!gOK)return;
 if(s==4){if(me.king)return msg('왕은 이미 정했어요');if(gp.y<.95)return msg('왕은 3층 이상 높이에 놓아야 해요')}
 const id=me.id+(nid++);addBlock(id,gp.x,gp.y,gp.z,me.rot,0,ty,skin);me.blocks-=C[s];sfx('place',gp);cd=now+120;
 if(s==4){me.king=id;me.kingY=gp.y;blocks[id].ms[0].material=new THREE.MeshLambertMaterial({map:WT,color:0xffd24a,emissive:0x664400});me.w=1;msg('👑 왕 설치! 상대는 모릅니다')}
 room&&room.emit('ev',{k:'b',id,p:[gp.x,gp.y,gp.z],r:me.rot,ty,sk:skin})}
function pick(){const{h}=aim();if(h&&h.distance<9&&h.object.userData.id){const id=h.object.userData.id;if(id==me.king)return msg('내 왕은 회수할 수 없어요');rmBlock(id);me.blocks++;sfx('pick');room&&room.emit('ev',{k:'x',id})}}
function mountTog(){if(me.mount){me.mount=null;sfx('mount');return}let best=null,bd=6;
 for(const id in blocks){const o=blocks[id];if(o.ty>1&&id.startsWith(me.id)){const d=o.g.position.distanceTo(pb.position);if(d<bd){bd=d;best=id}}}
 if(best){me.mount=best;sfx('mount');msg('포탑 조종 중 · Q로 해제')}else msg('가까이에 내 포탑이 없어요')}
const NM={1:'🧱 블록',2:'🔫 젠가 총',3:'💣 젠가 대포',4:'👑 왕 블록'};
function craft(s){if(me.blocks<C[s])return msg('블록이 부족해요');if(s==4&&me.king)return msg('왕은 이미 정했어요');me.w=s;if(s>1)sfx('mount')}
function msg(t){$('msg').textContent=t;if(t)setTimeout(()=>{if($('msg').textContent==t)$('msg').textContent=''},2000)}
function panel(){$('rc').innerHTML='<b>🛠 제작/설치</b>'+Object.keys(NM).map(k=>`<button data-k="${k}" class="${me.w==k?'on':''}" ${me.blocks<C[k]||(k==4&&me.king)?'disabled':''}>[${k}] ${NM[k]}<br><small>블록 ${C[k]}개${k==2?' · 설치형 포탑':k==3?' · 설치형 폭발포':k==4?' · 쓰러지면 패배':''}</small></button>`).join('')}
$('rc').onclick=e=>{const b=e.target.closest('button');if(b)craft(+b.dataset.k)};
// ---------- input
const K={};
onkeydown=e=>{K[e.code]=1;if(!playing)return;if(e.code=='KeyR')me.rot^=1;if(e.code=='KeyE')act();if(e.code=='KeyF')pick();if(e.code=='KeyQ')mountTog();if(e.code=='KeyT'){skin=(skin+1)%SK.length;msg('🎨 스킨: '+SK[skin][0]);skinUI()}if(/^Digit[1-4]$/.test(e.code))craft(+e.code[5])};
onkeyup=e=>K[e.code]=0;
onmousemove=e=>{if(locked||(dragMode&&e.buttons)){yaw-=e.movementX*.0025;pit=Math.max(-1.3,Math.min(1.3,pit-e.movementY*.0025))}};
rd.domElement.onmousedown=e=>{if(!playing)return;if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume();if(!locked&&!dragMode){rd.domElement.requestPointerLock();return}if(e.button==0)act();if(e.button==2)pick()};
rd.domElement.oncontextmenu=e=>e.preventDefault();
document.onpointerlockchange=()=>locked=!!document.pointerLockElement;
document.onpointerlockerror=()=>{dragMode=true;msg('드래그로 시점 이동 · E 설치/발사 · F 회수')};
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rd.setSize(innerWidth,innerHeight)};
function skinUI(){$('sk').innerHTML='🎨 젠가 스킨<br>'+SK.map((s,i)=>`<button data-i="${i}" class="${skin==i?'on':''}" style="background:#${s[1].toString(16).padStart(6,'0')}">${s[0]}</button>`).join('')}
$('sk').onclick=e=>{const b=e.target.closest('button');if(b){skin=+b.dataset.i;skinUI()}};skinUI();
const WS_URL=new URLSearchParams(location.search).get('server')||(location.protocol=='file:'?'ws://localhost:3000':(location.protocol=='https:'?'wss://':'ws://')+location.host);
function wsRoom(code){return new Promise((res,rej)=>{const ws=new WebSocket(WS_URL),evh=[],pcb=[],P={},mine={};
 const api={emit:(t,d)=>{ws.send(JSON.stringify({t:'e',d}));return Promise.resolve()},on:(t,f)=>evh.push(f),presence:p=>{Object.assign(mine,p);ws.send(JSON.stringify({t:'p',d:mine}));return Promise.resolve()},
  peers:()=>Object.values(P).map(v=>({isMe:false,presence:v})),onPeers:f=>pcb.push(f)};
 ws.onopen=()=>{ws.send(JSON.stringify({t:'j',c:code}));res(api)};ws.onerror=()=>rej();
 ws.onmessage=m=>{const x=JSON.parse(m.data);if(x.t=='e')evh.forEach(f=>f({isMe:false,data:x.d}));else{if(x.t=='p')P[x.i]=x.d;else delete P[x.i];pcb.forEach(f=>f({peers:api.peers()}))}}})}
// ---------- menu / start
async function begin(code){
 if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume()}
 $('err').textContent=code?'연결 중...':'';
 if(code){try{const R=window.claude&&await window.claude.use('room');room=R?await R.join('g'+code):await wsRoom(code);room.on('ev',ev);room.onPeers(c=>syncPeers(c.peers));syncPeers(room.peers())}
  catch(e){$('err').textContent='멀티플레이를 사용할 수 없어요. 연습장만 가능합니다.';return}
  $('room').style.display='block';$('room').textContent='🔑 초대코드 '+code}
 else addBot();
 map();tower();respawn();panel();$('menu').style.display='none';$('hud').style.display='block';playing=true;
 msg(code?'코드 '+code+' 를 친구에게! 먼저 4번으로 👑왕을 숨겨 설치하세요':'연습장: 2번 총을 설치하고 Q로 조종해 표적을 쏴보세요')}
$('b0').onclick=()=>begin(null);
$('b1').onclick=()=>begin(String(1000+Math.floor(Math.random()*9000)));
$('b2').onclick=()=>{const c=$('code').value.trim();if(!/^\d{4}$/.test(c))return $('err').textContent='4자리 숫자를 입력하세요';begin(c)};
// ---------- loop
let last=performance.now(),pt=0,ui=0;const tmpQ=new THREE.Quaternion(),UP=new V3(0,1,0);
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;
 if(playing){
  if(me.mount&&!blocks[me.mount])me.mount=null;
  const f=new V3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new V3(Math.cos(yaw),0,-Math.sin(yaw)),mv=new V3();
  if(me.hp>0&&!me.mount&&!over){if(K.KeyW)mv.add(f);if(K.KeyS)mv.sub(f);if(K.KeyD)mv.add(r);if(K.KeyA)mv.sub(r)}
  mv.normalize().multiplyScalar(K.ShiftLeft?9:5.5);
  pb.velocity.x+=(mv.x-pb.velocity.x)*.35;pb.velocity.z+=(mv.z-pb.velocity.z)*.35;
  if(K.Space&&grounded>0&&me.hp>0&&!me.mount){pb.velocity.y=8;grounded=0}
  pb.collisionResponse=!me.mount;
  if(me.mount){const o=blocks[me.mount];pb.position.set(o.g.position.x,o.g.position.y+HY[o.ty]+.9,o.g.position.z);pb.velocity.set(0,0,0)}
  W.step(1/60,dt,3);grounded-=dt;
  for(const c of W.contacts){if(c.bi===pb||c.bj===pb){const ny=c.bi===pb?-c.ni.y:c.ni.y;if(ny>.5)grounded=.12}}
  if(pb.position.y<-10)respawn();
  const myD=dirOf(yaw,pit);
  for(const id in blocks){const o=blocks[id];o.g.position.copy(o.b.position);o.g.quaternion.copy(o.b.quaternion);
   if(o.mz){if(id==me.mount)o.aq.setFromUnitVectors(UP,myD);o.mz.quaternion.copy(o.g.quaternion).invert().multiply(o.aq)}}
  for(const id in peers){const o=peers[id],s=o.t;if(!s)continue;const bf=o.pos.clone();o.pos.lerp(new V3(s.x,s.y,s.z),.3);const sp=bf.distanceTo(o.pos)/dt;o.g.legs.forEach((l,i)=>l.rotation.x=Math.sin(t/110+i*Math.PI)*Math.min(1,sp/5)*.8);o.g.position.copy(o.pos);o.g.rotation.y=s.yaw;
   o.g.bar.scale.x=Math.max(.01,s.hp/100);o.g.visible=s.hp>0&&!s.mt;if(o.kb)o.kb.position.set(o.pos.x,o.pos.y,o.pos.z);
   if(s.mt&&blocks[s.mt])blocks[s.mt].aq.setFromUnitVectors(UP,dirOf(s.yaw,s.pit||0))}
  pmesh.legs.forEach((l,i)=>l.rotation.x=Math.sin(t/110+i*Math.PI)*Math.min(1,mv.length()/5)*.8);pmesh.position.set(pb.position.x,pb.position.y,pb.position.z);pmesh.rotation.y=yaw;pmesh.visible=me.hp>0&&!me.mount;pmesh.bar.scale.x=Math.max(.01,me.hp/100);
  const tg=new V3(pb.position.x,pb.position.y+.8,pb.position.z);
  if(me.mount){const o=blocks[me.mount],top=o.g.position.clone();top.y+=HY[o.ty];cam.position.copy(top).addScaledVector(myD,-4.2);cam.position.y+=1;cam.lookAt(top.clone().addScaledVector(myD,14))}
  else{cam.position.copy(tg).addScaledVector(myD,-5).addScaledVector(r,.9);cam.position.y=Math.max(.4,cam.position.y);cam.lookAt(tg.clone().addScaledVector(myD,12).addScaledVector(r,.9))}
  gOK=false;if(ghost)ghost.visible=false;
  if(!me.mount&&!over){if(gType!=me.w)setGhost(me.w);const{h}=aim();if(h&&h.distance<16){const ty=me.w==4?1:me.w,n=h.face.normal.clone().transformDirection(h.object.matrixWorld),
    hx=ty==1&&!me.rot?L/2:ty==1?H/2:L/2,hz=ty==1&&!me.rot?H/2:L/2,off=Math.abs(n.x)*hx+Math.abs(n.y)*HY[ty]+Math.abs(n.z)*hz+.02;
    gp.copy(h.point).addScaledVector(n,off);if(Math.abs(n.y)>.5){gp.x=Math.round(gp.x/.2)*.2;gp.z=Math.round(gp.z/.2)*.2}
    ghost.position.copy(gp);ghost.rotation.y=me.rot?Math.PI/2:0;ghost.visible=gOK=true}}
  if(me.king&&!over){const k=blocks[me.king];if(!k||k.b.position.y<me.kingY-.55||k.b.position.y<.3){sfx('fall');room&&room.emit('ev',{k:'l'});endGame(false)}}
  if(!over&&me.hp>0){const now=performance.now();for(const id in blocks){const o=blocks[id];if(o.ty<2||!id.startsWith(me.id)||id==me.mount||now<(o.nf||0))continue;
   let bt=null,bd=o.ty==2?16:22;for(const pid in peers){const p=peers[pid];if(!p.t||p.t.hp<=0)continue;const q=p.pos.distanceTo(o.g.position);if(q<bd){bd=q;bt=p}}
   if(bt){const m0=o.g.localToWorld(new V3(0,HY[o.ty],0)),d=bt.pos.clone().add(new V3(0,.2,0)).sub(m0).normalize();o.aq.setFromUnitVectors(UP,d);
    d.add(new V3(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(.12)).normalize();const mz=m0.clone().addScaledVector(d,o.ty==2?.5:.75),t=o.ty==2?'g':'c';o.nf=now+(o.ty==2?900:4000);
    shoot(mz,d,t,true,.5);room&&room.emit('ev',{k:'s',t,o:[mz.x,mz.y,mz.z],d:[d.x,d.y,d.z]})}}}
  pt+=dt;if(pt>.08&&room){pt=0;const q=v=>Math.round(v*100)/100;room.presence({id:me.id,x:q(pb.position.x),y:q(pb.position.y),z:q(pb.position.z),yaw:q(yaw),pit:q(pit),hp:me.hp,mt:me.mount}).catch(()=>{})}
  ui+=dt;if(ui>.2){ui=0;$('hpb').style.width=me.hp+'%';
   $('inf').innerHTML=`❤️ ${me.hp} · 🧱 블록 ${me.blocks}<br>⚔️ 킬 ${me.k} · 💀 ${me.d}<br>${me.king?'👑 내 왕: 설치됨(금색)':'👑 왕 미설치 (4번)'}`+(room?`<br>👥 ${Object.keys(peers).length+1}명`:'');panel()}
 }
 for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.t-=dt;if(e.v){e.m.position.addScaledVector(e.v,dt);e.v.y-=18*dt;e.m.rotation.x+=dt*6}if(e.grow)e.m.scale.addScalar(dt*e.grow*3);if(e.t<=0){scene.remove(e.m);effects.splice(i,1)}}
 rd.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
